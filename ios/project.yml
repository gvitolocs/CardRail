name: CardRails

options:
  bundleIdPrefix: com.pokoin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    COMPILER_INDEX_STORE_ENABLE: NO
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"

targets:
  CardRails:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardRails
    info:
      path: CardRails/Info.plist
      properties:
        CardRailsAPIBase: https://cardrails-api.pokoin.com
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokoin.cardrails
        PRODUCT_NAME: CardRails
        DEVELOPMENT_TEAM: M2P66R95WD
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Card Rails"
        INFOPLIST_KEY_NSCameraUsageDescription: "Card Rails uses the camera to scan your cards."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

  CardRailsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardRailsTests
    dependencies:
      - target: CardRails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokoin.cardrails.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CardRails:
    build:
      targets:
        CardRails: all
        CardRailsTests: [test]
    test:
      targets:
        - CardRailsTests
